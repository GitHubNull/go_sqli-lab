name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  test-sqlite:
    name: Test with SQLite
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: go mod tidy

    - name: Run tests with SQLite
      run: go test -v ./src/db/...

    - name: Build application
      run: go build -o /tmp/sqli-lab ./src/main.go

    - name: Test database initialization
      run: |
        go run src/main.go --setup-db
        go run src/main.go &
        sleep 2
        curl -s http://localhost:8080/health
        pkill -f "go run src/main.go"

  test-mysql:
    name: Test with MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: test_sqli_lab
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: go mod tidy

    - name: Run tests with MySQL
      env:
        TEST_MYSQL_HOST: localhost
        TEST_MYSQL_PORT: 3306
        TEST_MYSQL_USER: root
        TEST_MYSQL_PASSWORD: rootpassword
        TEST_MYSQL_DB: test_sqli_lab
      run: go test -v ./src/db/...

  test-postgres:
    name: Test with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test_sqli_lab
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Install dependencies
      run: go mod tidy

    - name: Run tests with PostgreSQL
      env:
        TEST_POSTGRES_HOST: localhost
        TEST_POSTGRES_PORT: 5432
        TEST_POSTGRES_USER: postgres
        TEST_POSTGRES_PASSWORD: postgres
        TEST_POSTGRES_DB: test_sqli_lab
      run: go test -v ./src/db/...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: golangci-lint
      uses: golangci/golangci-lint-action@v9
      with:
        version: v2.13.2
