<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-labelledby="banner-title banner-desc">
  <title id="banner-title">Go SQLi Lab - SQL 注入学习平台</title>
  <desc id="banner-desc">深色科技风格横幅，包含代码片段、锁形图标、数据库结构和网络节点元素，配色为深蓝黑背景搭配青色和红色点缀。</desc>
  
  <defs>
    <!-- 背景渐变 -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1125"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    
    <!-- 青色光晕 -->
    <radialGradient id="glowCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </radialGradient>
    
    <!-- 红色光晕 -->
    <radialGradient id="glowRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff6b6b" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#ff6b6b" stop-opacity="0"/>
    </radialGradient>
    
    <!-- 网格图案 -->
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#4ecdc4" stroke-width="0.3" stroke-opacity="0.12"/>
    </pattern>
    
    <!-- 扫描线 -->
    <linearGradient id="scanline" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ecdc4" stop-opacity="0"/>
      <stop offset="50%" stop-color="#4ecdc4" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#4ecdc4" stop-opacity="0"/>
    </linearGradient>
  </defs>
  
  <!-- 背景 -->
  <rect width="100%" height="100%" fill="url(#bgGrad)"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>
  
  <!-- 装饰性光晕 -->
  <ellipse cx="200" cy="170" rx="300" ry="150" fill="url(#glowCyan)"/>
  <ellipse cx="1000" cy="170" rx="280" ry="140" fill="url(#glowRed)"/>
  
  <!-- 扫描线装饰 -->
  <rect x="0" y="0" width="1200" height="340" fill="url(#scanline)" opacity="0.5"/>
  
  <!-- 左侧：抽象代码片段 -->
  <g id="code-snippets" opacity="0.7">
    <!-- 代码行 1 -->
    <rect x="60" y="60" width="180" height="8" rx="2" fill="#4ecdc4" opacity="0.15"/>
    <rect x="60" y="60" width="120" height="8" rx="2" fill="#4ecdc4" opacity="0.3"/>
    <!-- 代码行 2 -->
    <rect x="60" y="80" width="220" height="8" rx="2" fill="#ff6b6b" opacity="0.12"/>
    <rect x="60" y="80" width="80" height="8" rx="2" fill="#ff6b6b" opacity="0.25"/>
    <!-- 代码行 3 -->
    <rect x="60" y="100" width="160" height="8" rx="2" fill="#667eea" opacity="0.15"/>
    <rect x="60" y="100" width="100" height="8" rx="2" fill="#667eea" opacity="0.3"/>
    <!-- 代码行 4 -->
    <rect x="60" y="120" width="200" height="8" rx="2" fill="#4ecdc4" opacity="0.1"/>
    <rect x="60" y="120" width="60" height="8" rx="2" fill="#4ecdc4" opacity="0.2"/>
    <!-- 代码行 5 -->
    <rect x="60" y="140" width="140" height="8" rx="2" fill="#a8edea" opacity="0.12"/>
    <rect x="60" y="140" width="90" height="8" rx="2" fill="#a8edea" opacity="0.25"/>
    <!-- 代码行 6 -->
    <rect x="60" y="160" width="190" height="8" rx="2" fill="#ff6b6b" opacity="0.1"/>
    <rect x="60" y="160" width="70" height="8" rx="2" fill="#ff6b6b" opacity="0.2"/>
    <!-- 代码行 7 -->
    <rect x="60" y="180" width="170" height="8" rx="2" fill="#4ecdc4" opacity="0.08"/>
    <rect x="60" y="180" width="110" height="8" rx="2" fill="#4ecdc4" opacity="0.18"/>
    <!-- 代码行 8 -->
    <rect x="60" y="200" width="150" height="8" rx="2" fill="#667eea" opacity="0.12"/>
    <rect x="60" y="200" width="85" height="8" rx="2" fill="#667eea" opacity="0.22"/>
    <!-- 代码行 9 -->
    <rect x="60" y="220" width="210" height="8" rx="2" fill="#4ecdc4" opacity="0.1"/>
    <rect x="60" y="220" width="95" height="8" rx="2" fill="#4ecdc4" opacity="0.2"/>
    <!-- 代码行 10 -->
    <rect x="60" y="240" width="130" height="8" rx="2" fill="#ff6b6b" opacity="0.08"/>
    <rect x="60" y="240" width="75" height="8" rx="2" fill="#ff6b6b" opacity="0.15"/>
  </g>
  
  <!-- 中央偏左：锁形图标（安全象征） -->
  <g id="lock-icon" transform="translate(480, 100)" opacity="0.35">
    <!-- 锁体外发光 -->
    <circle cx="60" cy="70" r="55" fill="url(#glowCyan)" opacity="0.3"/>
    <!-- 锁体 -->
    <rect x="25" y="50" width="70" height="55" rx="8" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.5"/>
    <rect x="25" y="50" width="70" height="55" rx="8" fill="#4ecdc4" opacity="0.04"/>
    <!-- 锁梁 -->
    <path d="M 40 50 L 40 35 A 20 20 0 0 1 80 35 L 80 50" fill="none" stroke="#4ecdc4" stroke-width="1.5" opacity="0.5"/>
    <!-- 锁孔 -->
    <circle cx="60" cy="72" r="5" fill="#4ecdc4" opacity="0.35"/>
    <rect x="57.5" y="72" width="5" height="12" rx="1.5" fill="#4ecdc4" opacity="0.35"/>
    <!-- 装饰点 -->
    <circle cx="60" cy="20" r="2" fill="#ff6b6b" opacity="0.3"/>
    <circle cx="20" cy="70" r="1.5" fill="#4ecdc4" opacity="0.25"/>
    <circle cx="100" cy="70" r="1.5" fill="#4ecdc4" opacity="0.25"/>
  </g>
  
  <!-- 中央偏右：数据库结构（圆柱体） -->
  <g id="database-icon" transform="translate(680, 110)" opacity="0.3">
    <!-- 发光背景 -->
    <ellipse cx="50" cy="60" rx="70" ry="50" fill="url(#glowRed)" opacity="0.25"/>
    <!-- 顶层椭圆 -->
    <ellipse cx="50" cy="25" rx="45" ry="18" fill="none" stroke="#ff6b6b" stroke-width="1.2" opacity="0.45"/>
    <ellipse cx="50" cy="25" rx="45" ry="18" fill="#ff6b6b" opacity="0.03"/>
    <!-- 中层椭圆 -->
    <ellipse cx="50" cy="55" rx="45" ry="18" fill="none" stroke="#ff6b6b" stroke-width="1.2" opacity="0.35"/>
    <!-- 底层椭圆 -->
    <ellipse cx="50" cy="85" rx="45" ry="18" fill="none" stroke="#ff6b6b" stroke-width="1.2" opacity="0.25"/>
    <!-- 连接线 -->
    <line x1="5" y1="25" x2="5" y2="85" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
    <line x1="95" y1="25" x2="95" y2="85" stroke="#ff6b6b" stroke-width="1" opacity="0.3"/>
    <!-- 数据点装饰 -->
    <circle cx="50" cy="25" r="3" fill="#ff6b6b" opacity="0.25"/>
    <circle cx="30" cy="55" r="2" fill="#ff6b6b" opacity="0.2"/>
    <circle cx="70" cy="55" r="2" fill="#ff6b6b" opacity="0.2"/>
  </g>
  
  <!-- 右侧：网络节点 -->
  <g id="network-nodes" opacity="0.6">
    <!-- 节点连线 -->
    <line x1="950" y1="80" x2="1020" y2="140" stroke="#4ecdc4" stroke-width="1" opacity="0.3"/>
    <line x1="1020" y1="140" x2="1100" y2="100" stroke="#4ecdc4" stroke-width="1" opacity="0.3"/>
    <line x1="1020" y1="140" x2="1080" y2="200" stroke="#ff6b6b" stroke-width="1" opacity="0.25"/>
    <line x1="950" y1="80" x2="980" y2="180" stroke="#667eea" stroke-width="1" opacity="0.2"/>
    <line x1="1100" y1="100" x2="1080" y2="200" stroke="#4ecdc4" stroke-width="1" opacity="0.2"/>
    <line x1="980" y1="180" x2="1080" y2="200" stroke="#667eea" stroke-width="1" opacity="0.25"/>
    <line x1="950" y1="80" x2="1100" y2="100" stroke="#4ecdc4" stroke-width="0.8" opacity="0.15"/>
    
    <!-- 节点 -->
    <circle cx="950" cy="80" r="6" fill="#4ecdc4" opacity="0.5"/>
    <circle cx="950" cy="80" r="12" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.2"/>
    
    <circle cx="1020" cy="140" r="8" fill="#ff6b6b" opacity="0.5"/>
    <circle cx="1020" cy="140" r="16" fill="none" stroke="#ff6b6b" stroke-width="1" opacity="0.2"/>
    
    <circle cx="1100" cy="100" r="5" fill="#667eea" opacity="0.5"/>
    <circle cx="1100" cy="100" r="10" fill="none" stroke="#667eea" stroke-width="1" opacity="0.2"/>
    
    <circle cx="1080" cy="200" r="6" fill="#4ecdc4" opacity="0.4"/>
    <circle cx="1080" cy="200" r="12" fill="none" stroke="#4ecdc4" stroke-width="1" opacity="0.15"/>
    
    <circle cx="980" cy="180" r="4" fill="#a8edea" opacity="0.4"/>
  </g>
  
  <!-- 底部装饰线 -->
  <line x1="0" y1="320" x2="1200" y2="320" stroke="#4ecdc4" stroke-width="1" opacity="0.15"/>
  <line x1="0" y1="325" x2="1200" y2="325" stroke="#ff6b6b" stroke-width="0.5" opacity="0.1"/>
  
  <!-- 标题区域（中央） -->
  <g id="title-area" transform="translate(600, 200)">
    <!-- 标题背景遮罩：确保文字清晰可读 -->
    <rect x="-320" y="-45" width="640" height="130" rx="8" fill="#0d1125" opacity="0.55"/>
    
    <!-- 装饰括号 -->
    <text x="-280" y="15" font-family="'Courier New', monospace" font-size="48" fill="#4ecdc4" opacity="0.35" text-anchor="middle">[</text>
    <text x="280" y="15" font-family="'Courier New', monospace" font-size="48" fill="#4ecdc4" opacity="0.35" text-anchor="middle">]</text>
    
    <!-- 主标题 -->
    <text x="0" y="0" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="56" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="4">GO SQLI LAB</text>
    
    <!-- 副标题 -->
    <text x="0" y="40" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-weight="400" fill="#4ecdc4" text-anchor="middle" letter-spacing="6" opacity="0.95">SQL INJECTION LEARNING PLATFORM</text>
    
    <!-- 装饰线 -->
    <line x1="-200" y1="60" x2="200" y2="60" stroke="#4ecdc4" stroke-width="1" opacity="0.35"/>
    <circle cx="-200" cy="60" r="3" fill="#ff6b6b" opacity="0.5"/>
    <circle cx="200" cy="60" r="3" fill="#ff6b6b" opacity="0.5"/>
  </g>
  
  <!-- 角落装饰 -->
  <g id="corner-decor" opacity="0.3">
    <!-- 左上角 -->
    <path d="M 0 40 L 0 0 L 40 0" fill="none" stroke="#4ecdc4" stroke-width="2"/>
    <!-- 右上角 -->
    <path d="M 1160 0 L 1200 0 L 1200 40" fill="none" stroke="#ff6b6b" stroke-width="2"/>
    <!-- 左下角 -->
    <path d="M 0 300 L 0 340 L 40 340" fill="none" stroke="#ff6b6b" stroke-width="2"/>
    <!-- 右下角 -->
    <path d="M 1160 340 L 1200 340 L 1200 300" fill="none" stroke="#4ecdc4" stroke-width="2"/>
  </g>
</svg>
