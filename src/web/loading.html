<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>数据库重置中 - Go SQLi Lab</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .loading-container {
            max-width: 600px;
            margin: 40px auto;
            padding: 40px;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 15px;
            border: 2px solid rgba(255, 107, 107, 0.5);
        }
        .spinner {
            width: 80px;
            height: 80px;
            margin: 0 auto 30px;
            border: 6px solid rgba(255, 107, 107, 0.2);
            border-top: 6px solid #ff6b6b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .loading-text {
            font-size: 1.5em;
            color: #ff6b6b;
            margin-bottom: 15px;
        }
        .loading-detail {
            color: #888;
            margin-bottom: 10px;
        }
        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 4px;
            overflow: hidden;
            margin: 30px 0;
        }
        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #ff416c 0%, #ff4b2b 100%);
            width: 0%;
            animation: progress 8s ease-out forwards;
        }
        @keyframes progress {
            0% { width: 0%; }
            100% { width: 100%; }
        }
        .status-message {
            color: #aaa;
            font-size: 0.9em;
            margin-top: 20px;
            height: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="loading-container">
            <div class="spinner"></div>
            <h1 class="loading-text">🔄 正在重置数据库...</h1>
            <p class="loading-detail">正在清除数据并重新初始化</p>
            <div class="progress-bar">
                <div class="progress-fill"></div>
            </div>
            <p class="status-message" id="statusMessage">正在连接数据库...</p>
        </div>
    </div>

    <script>
        // 状态消息列表
        const messages = [
            "正在连接数据库...",
            "正在清除表数据...",
            "正在重新创建表结构...",
            "正在插入种子数据...",
            "正在完成重置...",
        ];
        
        let messageIndex = 0;
        const statusElement = document.getElementById('statusMessage');
        
        // 更新状态消息
        function updateStatus() {
            if (messageIndex < messages.length) {
                statusElement.textContent = messages[messageIndex];
                messageIndex++;
                setTimeout(updateStatus, 1500);
            }
        }
        
        // 开始更新状态
        updateStatus();
        
        // 执行重置请求
        fetch('/api/reset-db', { method: 'POST' })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    // 重置成功，跳转到成功页面
                    window.location.href = '/setup-success?' + new URLSearchParams({
                        cleared: data.clearedTables,
                        inserted: data.insertedRecords,
                        time: data.executionTime
                    });
                } else {
                    // 重置失败，跳转到错误页面
                    window.location.href = '/setup-error?message=' + encodeURIComponent(data.error);
                }
            })
            .catch(error => {
                window.location.href = '/setup-error?message=' + encodeURIComponent('网络错误: ' + error.message);
            });
    </script>
</body>
</html>
